<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinh Video - Admin Panel</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #1a1a1a; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; color: #333; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; box-sizing: border-box; outline: none; }
        input:focus, select:focus { border-color: #0066ff; }
        button { width: 100%; background: #0066ff; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        .result-box { margin-top: 20px; background: #f8f9fa; padding: 15px; border-radius: 10px; border-left: 4px solid #0066ff; display: none; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>
<div class="container">
    <h2>🛠️ Quản lý tài khoản</h2>
    
    <div class="form-group">
        <label>Link API Render của bạn:</label>
        <input type="text" id="apiUrl" value="https://chinh-video-api.onrender.com">
    </div>

    <div class="form-group">
        <label>Tên tài khoản (Username):</label>
        <input type="text" id="username" placeholder="Nhập tên user (VD: chinhly_212)">
    </div>

    <button onclick="checkUser()">Kiểm tra thông tin</button>

    <hr style="margin: 25px 0; border: 0; border-top: 1px solid #eee;">

    <div class="form-group">
        <label>Cấp quyền Pro:</label>
        <select id="isPro">
            <option value="true">Bật Pro (True)</option>
            <option value="false">Tắt Pro (False)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Cộng thêm ngày dùng thử:</label>
        <input type="number" id="extendDays" value="14">
    </div>

    <button style="background: #28a745;" onclick="updateUser()">Cập nhật ngay</button>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
    async function checkUser() {
        const url = document.getElementById('apiUrl').value.trim();
        const username = document.getElementById('username').value.trim();
        const box = document.getElementById('resultBox');
        
        if (!username) { 
            alert('Vui lòng nhập tên tài khoản!'); 
            return; 
        }
        
        try {
            const res = await fetch(`${url}/api/user/${username}`);
            box.style.display = 'block';
            
            if (res.status === 404) {
                box.style.borderLeftColor = '#e41e3f';
                box.innerHTML = `<span style="color:#e41e3f; font-weight:bold;">❌ Tài khoản "${username}" không tồn tại trên hệ thống!</span>`;
                return;
            }

            const data = await res.json();
            box.style.borderLeftColor = '#0066ff';
            box.innerHTML = `<b>Thông tin tài khoản:</b><br>` +
                            `- User: ${data.username}<br>` +
                            `- Pro: <b>${data.is_pro ? 'Đang bật ⭐' : 'Chưa bật'}</b><br>` +
                            `- Còn hạn dùng thử: ${data.is_trial_active ? 'Còn' : 'Hết'}<br>` +
                            `- Hết hạn: ${new Date(data.trial_expires_at).toLocaleString()}`;
        } catch (err) { 
            box.style.display = 'block'; 
            box.style.borderLeftColor = '#e41e3f';
            box.innerHTML = `<span style="color:#e41e3f;">⚠️ Lỗi kết nối đến máy chủ API!</span>`; 
        }
    }

    async function updateUser() {
        const url = document.getElementById('apiUrl').value.trim();
        const username = document.getElementById('username').value.trim();
        const isPro = document.getElementById('isPro').value === 'true';
        const extendDays = parseInt(document.getElementById('extendDays').value) || 0;
        const box = document.getElementById('resultBox');
        
        if (!username) { 
            alert('Vui lòng nhập tên tài khoản!'); 
            return; 
        }
        
        try {
            const res = await fetch(`${url}/api/admin/update-user/${username}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_pro: isPro, extend_days: extendDays })
            });
            
            box.style.display = 'block';
            
            if (res.status === 404) {
                box.style.borderLeftColor = '#e41e3f';
                box.innerHTML = `<span style="color:#e41e3f; font-weight:bold;">❌ Không thể cập nhật: Tài khoản không tồn tại!</span>`;
                return;
            }

            const data = await res.json();
            box.style.borderLeftColor = '#28a745';
            box.innerHTML = `<span style="color:#28a745; font-weight:bold;">✅ ${data.message || 'Cập nhật thành công!'}</span>`;
            
            checkUser();
        } catch (err) { 
            box.style.display = 'block'; 
            box.style.borderLeftColor = '#e41e3f';
            box.innerHTML = `<span style="color:#e41e3f;">⚠️ Lỗi kết nối khi cập nhật!</span>`; 
        }
    }
</script>
</body>
</html>
